name: Claude Auto Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          additional_permissions: |
            actions: read
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR against the project's standards in CLAUDE.md and
            .claude/rules/ (architecture.md, development-patterns.md, testing.md).

            ## Architecture (the trust model — treat breaches as critical)
            - **Proposal-queue invariant**: agent code MUST NOT mutate user state directly.
              Writes go through `proposal_enqueue`/the `propose` tool → the applier applies
              approved proposals. Flag any direct vault/calendar/email/Linear write from the
              agent container as ARCHITECTURE BREAKING.
            - **Trust zones**: the agent container holds NO write creds; host-side services
              (applier, etc.) hold them. Flag any change that crosses this boundary.
            - **Cross-language contracts**: proposal frontmatter (Pydantic) ↔ applier ↔ docs
              must stay in sync; a schema change must update all sides + docs/PROPOSAL_FORMAT.md.

            ## Completeness Checks
            - **Documentation**: are relevant docs in `docs/` updated for behavior changes?
            - **Tests**: tests for new functionality? regression tests for fixes? (see .claude/rules/testing.md)
            - **Style**: type hints throughout (Python), `from __future__ import annotations`,
              specific exceptions (no bare `except`), no mutable default args, enums not magic strings.

            ## Tracking (Linear team: Personal Assistant, prefix PA-)
            - If the PR resolves tech debt or bugs, verify the corresponding PA- issues are noted for closing.
            - If it introduces debt or bugs, verify they're noted for new PA- issues with the right labels (tech-debt, bug).

            ## Review Style
            - Use inline comments for specific issues with concrete suggestions.
            - Prefix minor issues with "nit: ".
            - Keep the summary to 1-2 paragraphs on overall assessment.
            - For revisions, verify prior comments were addressed AND check the new code.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
